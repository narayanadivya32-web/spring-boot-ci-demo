name: Docker Build -> Push > Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
    - name: Setup Java 
      uses: actions/setup-java@v5
      with:
                  distribution: temurin
                  java-version: '21'

    - name: Build Jar
      run: ./mnvw clean package -DskipTests

    - name: Login to Docker Hub
      run: docker login -u $"{{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-ci-demo:latest

    - name: Push Image to Docker Hub 
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-ci-demo:latest

    - name: SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
       host: ${{ secrets.EC2_HOST }}
       username: ${{ secrets.EC2_USER }}
       key: ${{ secrets.EC2_SSH_KEY }}
       script: |
        docker stop spring-demo || true
        docker rm spring-demo || true
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-ci-demo:latest
        docker run -d --name spring-demo -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-ci-demo:latest
 

    
